image: node:22-alpine

# Mise en cache des dépendances pour accélérer les builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/

# Fichiers à compresser, et nom de l'application à utiliser
variables:
  FILES_TO_COMPRESS: "htm html txt text js css md ico svg"
  APP_NAME: "markpage"

pages:
  script:
    # Installation des outils de compression
    - apk add --no-cache gzip brotli

    # Récupération de tous les fichiers du dépôt, de manière récursive dans un dossier temporaire .public
    - mkdir .public
    - cp -r * .public

    # Création du dossier build_dir et récupération de l'application
    - mkdir -p build_dir
    - wget https://forge.apps.education.fr/$APP_NAME/$APP_NAME.forge.apps.education.fr/-/archive/main/$APP_NAME.forge.apps.education.fr-main.tar.bz2
    - tar -xjf $APP_NAME.forge.apps.education.fr-main.tar.bz2 --strip-components=1 -C build_dir

    # Copie de tous les fichiers du dépôt (copiés dans .public) dans build_dir/app
    # Permet de remplacer les fichiers statiques de l'application par ceux du dépôt, pour que le site soit à jour
    - cp -r .public/* build_dir/app/

    # On se place dans le dossier build_dir pour construire l'application
    - cd build_dir

    # Mise à jour du service worker
    # on change dans le fichier app/pwa/service-worker/swConfig.mjs les variables APP_NAME et SW_VERSION
    # - pour APP_NAME, on met comme valeur le nom du projet GitLab, suivi de l'ID du projet (unique pour chaque projet), afin que le service worker soit unique pour chaque projet
    # - pour SW_VERSION, on met comme valeur le SHA du dernier commit, afin de forcer le navigateur à recharger le service worker à chaque commit
    - |
      if [ -f "app/pwa/service-worker/swConfig.mjs" ]; then
        NEW_SW_VERSION=$(echo $CI_COMMIT_SHA | cut -c1-8)
        sed -i "s/export const SW_VERSION = .*/export const SW_VERSION = \"$NEW_SW_VERSION\";/" app/pwa/service-worker/swConfig.mjs
        sed -i "s/export const APP_NAME = .*/export const APP_NAME = \"$CI_PROJECT_NAME-$CI_PROJECT_ID\";/" app/pwa/service-worker/swConfig.mjs
      else
        echo "Warning - swConfig.mjs not found"
      fi

    # Construction de l'application
    - npm ci --cache ../.npm --prefer-offline --no-audit
    - npm run build

    # Compression des fichiers spécifiés
    - cd ..
    - sh build_dir/scripts/deploy/compress-assets.sh "build_dir/dist" "$FILES_TO_COMPRESS"

    # On déplace le contenu de build_dir/dist dans public, car GitLab Pages ne publie que le contenu du dossier public
    - mv build_dir/dist public

  artifacts:
    paths:
      - public
    expire_in: 3 days

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
