# https://taskfile.dev

version: "3"

tasks:
  build:
    aliases:
      - default
    cmds:
      - task: npm:build

  npm:build:
    deps: [npm:install]
    sources:
      - index.md
      - indexLightpad.md
      - css/**/*.css
      - js/**/*.js
      - rollup.config.mjs
    generates:
      - css/*.min.css
      - script.min.js
      - script.min.js.map
    cmds:
      - npm run build

  npm:install:
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm install

  push:
    cmds:
      - git push apps
      - git push apps --tags
      - git push markpage
      - git push markpage --tags
      - git push lightpad
      - git push lightpad --tags
      - git push github
      - git push github --tags

  tag:
    desc: "Crée un tag avec pour date du tag la date du commit (usage: task tag -- <commit> <tag>)"
    cmds:
      - |
        bash -c '
        set -- {{.CLI_ARGS}}
        COMMIT=$1
        TAG=$2

        if [ -z "$COMMIT" ] || [ -z "$TAG" ]; then
          echo "❌ Usage: task tag -- <commit> <tag>"
          exit 1
        fi

        TAG_DATE=$(git show -s --format=%aD "$COMMIT")
        echo "📌 Création du tag \"$TAG\" sur le commit $COMMIT (date: $TAG_DATE)"
        GIT_COMMITTER_DATE="$TAG_DATE" git tag -a "$TAG" "$COMMIT" -m ""
        '
    silent: false

  bump:
    generates:
      - VERSION
      - package.json
      - package-lock.json
    cmds:
      - cz bump

  format:
    desc: Formate les fichiers avec Oxfmt
    cmds:
      - npx oxfmt --config .oxfmtrc.json .

  format:check:
    desc: Vérifie le format des fichiers avec Oxfmt
    cmds:
      - npx oxfmt --config .oxfmtrc.json --check .

  format:staged:
    desc: Formate uniquement les fichiers staged (pour le hook pre-commit)
    silent: true
    cmds:
      - |
        FILES=$(git diff --cached --name-only --diff-filter=ACM)
        if [ -z "$FILES" ]; then
          exit 0
        fi
        npx oxfmt --config .oxfmtrc.json $FILES
    ignore_error: true

  html-validate:
    desc: Vérifie la validité des fichiers HTML avec html-validate
    cmds:
      - npx html-validate "{{.APP_FOLDER}}/**/*.html" --preset recommended,prettier

  lint:
    desc: Lint les fichiers .mjs avec Oxlint, en affichant uniquement les erreurs principales
    silent: true
    cmds:
      - SHOW_MAIN_ERRORS_ONLY=1 npx oxlint --config oxlint.config.mjs . -f stylish

  lint:staged:
    desc: Lint uniquement les fichiers .mjs staged (pour le hook pre-commit)
    silent: true
    cmds:
      - |
        FILES=$(git diff --cached --name-only --diff-filter=ACM -- '{{.APP_FOLDER}}/**/*.mjs')
        if [ -z "$FILES" ]; then
          exit 0
        fi
        SHOW_MAIN_ERRORS_ONLY=1 npx oxlint --config oxlint.config.mjs $FILES -f stylish
    ignore_error: true

  lint:errors:
    desc: Lint les fichiers .mjs avec Oxlint, en affichant seulement les erreurs bloquantes
    silent: true
    cmds:
      - SHOW_MAIN_ERRORS_ONLY=1 npx oxlint --config oxlint.config.mjs --quiet . -f stylish

  lint:all:
    desc: Lint tous les fichiers .mjs avec Oxlint, en affichant toutes les erreurs, même les simples warnings
    silent: true
    cmds:
      - npx oxlint --config oxlint.config.mjs --report-unused-disable-directives-severity "warn" . -f stylish
